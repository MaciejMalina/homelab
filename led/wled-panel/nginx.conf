# =============================================================================
#  nginx — panel LED + proxy do WLED-a (jeden origin = zero problemów z CORS)
# =============================================================================
#  PODMIEŃ 192.168.1.60 na adres swojego ESP z WLED.
#  Używaj IP, nie nazwy .local — nginx w kontenerze nie rozwiązuje mDNS.
# =============================================================================

upstream wled {
    server 192.168.1.60:80;
    keepalive 4;
}

server {
    listen 80;
    server_name _;

    # --- panel ---------------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store";
        # Panel ma działać osadzony w iframe na Homepage — nie blokuj tego.
        add_header X-Frame-Options "" always;
    }

    # --- proxy do WLED -------------------------------------------------------
    # /wled/json/state  ->  http://192.168.1.60/json/state
    location /wled/ {
        proxy_pass         http://wled/;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;

        # WLED to mikrokontroler — nie czekaj na niego w nieskończoność
        proxy_connect_timeout 3s;
        proxy_send_timeout    5s;
        proxy_read_timeout    5s;

        # stan ma być zawsze świeży
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # WebSocket WLED-a (live podgląd stanu bez odpytywania)
    location /wled/ws {
        proxy_pass          http://wled/ws;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_read_timeout  600s;
    }

    # Pełne UI WLED-a, gdyby panel nie wystarczał (osobny kafelek na Homepage)
    location /pelne/ {
        proxy_pass         http://wled/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_read_timeout 30s;
    }
}
