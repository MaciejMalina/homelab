# JARVIS — panel na starym telefonie (Redmi Note 9 Pro), malinka.
# network_mode: host, bo "Obudź serwer/PC" wysyła WoL broadcastem do LAN-u (z sieci bridge nie wyjdzie).
# Port: PORT z .env (domyślnie 8084) — sprawdź przed startem:  ss -tlnp | grep 8084
#   telefon w LAN:   http://192.168.254.10:8084
#   tailnet (opcja): sudo tailscale serve --bg --https=8446 http://localhost:8084
# Sterowanie z JARVIS-a (bot/n8n/skrypty na malince):
#   curl -s -X POST -H 'Content-Type: application/json' -d '{"mode":"on","minutes":10}' http://127.0.0.1:8084/api/screen
#   curl -s -X POST -H 'Content-Type: application/json' -d '{"text":"Backup padł","level":"crit"}' http://127.0.0.1:8084/api/alert
#
# Kontenery Dockera w panelu (Serwery -> „Zarządzaj kontenerami"): panel NIE dostaje gniazda Dockera. Rozmawia z
# docker-socket-proxy, które przepuszcza tylko listę kontenerów, logi i restart, i słucha wyłącznie na 127.0.0.1:2375.
services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: jarvis_docker_proxy
    environment:
      CONTAINERS: 1        # lista, szczegóły i logi kontenerów (tylko odczyt)
      ALLOW_RESTARTS: 1    # POST .../restart (oraz stop/kill — panel wywołuje wyłącznie restart)
      POST: 0              # reszta zapisów (tworzenie, usuwanie, exec…) zablokowana
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:2375:2375"   # tylko localhost malinki; panel chodzi w network_mode: host
    restart: unless-stopped
    mem_limit: 32m

  panel:
    build: .
    image: jarvis-panel:local
    container_name: jarvis_panel
    network_mode: host
    env_file: .env
    environment:
      TZ: Europe/Warsaw
    volumes:
      - ./data:/data
      # klucz, którym bot robi /shutdown_serwer (jpower@serwer, forced command) — tylko do odczytu
      - ../jarvis-bot/ssh_keys/id_rsa:/ssh/id_rsa:ro
      # stan mail-notifiera (ważne nieprzeczytane maile) — zakładka Dzień, tylko do odczytu
      - ../mail-notifier/state:/mail:ro
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:%s/api/health' % os.environ.get('PORT','8084'),timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
