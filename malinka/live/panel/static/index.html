<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070912">
<title>JARVIS — panel</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<div id="szkielet">
  <main id="tresc">
    <header id="naglowek"><h1 id="tytul">Przegląd</h1><div class="info" id="naglowek-info"></div><span id="zegarek">--:--</span></header>

    <!-- Przegląd: stały układ (reszta zakładek renderuje się z JS) -->
    <section class="zakladka" id="t-przeglad">
      <div class="siatka">
        <div id="czas" class="karta" data-akcja="pogoda-otworz" role="button" aria-label="Pogoda — szczegóły">
          <div id="zegar">--:--</div>
          <div id="data"></div>
          <div id="pogoda" class="przyg">Pogoda…</div>
        </div>
        <div id="todo" class="karta">
          <h2><span>TO DO</span><span id="todo-licznik" class="prawo"></span></h2>
          <div class="przewijane" data-scroll="todo"><ul id="lista"></ul></div>
          <form id="nowe" autocomplete="off">
            <input id="nowe-tytul" placeholder="Nowe zadanie…" maxlength="300" enterkeyhint="done">
            <button class="glowny" type="submit" aria-label="Dodaj">+</button>
          </form>
        </div>
        <div id="jarvis" class="karta">
          <h2><span>JARVIS</span><span id="odswiezone" class="prawo"></span></h2>
          <div class="stany">
            <div class="wiersz"><span class="kropka" id="k-serwer"></span><span class="k">Serwer</span><span class="v zawijaj" id="v-serwer">…</span></div>
            <div class="wiersz"><span class="kropka" id="k-malinka"></span><span class="k">Malinka</span><span class="v zawijaj" id="v-malinka">…</span></div>
            <div class="wiersz"><span class="kropka" id="k-kuma"></span><span class="k">Kuma</span><span class="v zawijaj" id="v-kuma">…</span></div>
          </div>
          <div class="przyciski jarvis-przyciski">
            <button id="b-wake" class="glowny" data-akcja="serwer" data-cmd="wake">Obudź serwer</button>
            <button id="b-sleep" class="groznie" data-akcja="serwer" data-cmd="sleep" data-potwierdz>Uśpij serwer</button>
            <div id="pc-budzenie" class="przyciski pelna"></div>
            <button class="pelna" data-akcja="ekran-off">Wygaś ekran</button>
          </div>
        </div>
      </div>
    </section>

    <section class="zakladka" id="t-inne" hidden></section>

    <!-- widok szczegółowy (pogoda, kontenery) — nakładka na obszar treści; pasek zakładek zostaje -->
    <div id="widok" hidden>
      <header id="widok-naglowek">
        <button class="maly" data-akcja="widok-wstecz" aria-label="Wróć">‹ Wróć</button>
        <h1 id="widok-tytul"></h1><div class="info" id="widok-info"></div>
      </header>
      <div id="widok-tresc"></div>
    </div>
  </main>
  <nav id="rail"></nav>
</div>

<div id="alert" hidden><span id="alert-tekst"></span><button class="x" id="alert-x" aria-label="Zamknij">×</button></div>
<div id="toast"></div>
<div id="gest"></div>
<div id="offline" hidden>Brak połączenia z malinką — ponawiam…</div>
<div id="sen" hidden></div>

<script src="panel.js"></script>
</body>
</html>
