plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.maciej.jarvispanel'
    compileSdk 35

    defaultConfig {
        applicationId 'pl.maciej.jarvispanel'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.5'
        // MediaPipe ma natywne biblioteki na każdą architekturę — Redmi Note 9 Pro to arm64, reszty nie pakujemy
        ndk { abiFilters 'arm64-v8a' }
    }

    // model gestów (app/src/main/assets/gesture_recognizer.task, pobierany w workflow) czytany bez rozpakowywania
    androidResources {
        noCompress 'task', 'tflite'
    }

    // Stały klucz podpisu (z sekretów GitHuba), żeby każda nowa wersja instalowała się NA starą
    // bez odinstalowania. Bez zmiennych PANEL_KS* zostaje zwykły klucz debug.
    signingConfigs {
        stala {
            def ks = System.getenv('PANEL_KS_FILE')
            if (ks) {
                storeFile file(ks)
                storeType 'pkcs12'
                storePassword System.getenv('PANEL_KS_PASS')
                keyAlias 'panel'
                keyPassword System.getenv('PANEL_KS_PASS')
            }
        }
    }
    buildTypes {
        debug {
            if (System.getenv('PANEL_KS_FILE')) signingConfig signingConfigs.stala
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    def camerax = '1.4.1'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'
    // Hey Jarvis: openWakeWord (melspectrogram + embedding + hey_jarvis) jako TFLite
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
}
