# JARVIS - sterownik LED RGBW przy biurku (ESP-12F / ESP8266, plytka "Sterownik RGBW" K. Gawel 2019, zasilanie POWER 12 V).
# Zlacze UART plytki: 1=VCC 3,3 V, 2=GND, 3=RX, 4=TX (jak w przedluzaczach); pola FLASH = GPIO0 do GND.
# Etap 1: testowe kanaly PWM na kandydujacych pinach - ustalamy, ktory pin to R, G, B, W.
esphome:
  name: sterownik-led
  friendly_name: Sterownik LED

esp8266:
  board: esp12e
  restore_from_flash: true

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.254.42
    gateway: 192.168.254.1
    subnet: 255.255.255.0
    dns1: 192.168.254.1
  ap:
    ssid: "sterownik-led Fallback"
    password: !secret ap_password

captive_portal:

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  auth:
    username: admin
    password: !secret web_password

output:
  - platform: esp8266_pwm
    pin: GPIO4
    id: pwm_gpio4
    frequency: 1000 Hz
  - platform: esp8266_pwm
    pin: GPIO5
    id: pwm_gpio5
    frequency: 1000 Hz
  - platform: esp8266_pwm
    pin: GPIO12
    id: pwm_gpio12
    frequency: 1000 Hz
  - platform: esp8266_pwm
    pin: GPIO13
    id: pwm_gpio13
    frequency: 1000 Hz
  - platform: esp8266_pwm
    pin: GPIO14
    id: pwm_gpio14
    frequency: 1000 Hz
  - platform: esp8266_pwm
    pin: GPIO15
    id: pwm_gpio15
    frequency: 1000 Hz

light:
  - platform: monochromatic
    output: pwm_gpio4
    name: "Test GPIO4"
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s
  - platform: monochromatic
    output: pwm_gpio5
    name: "Test GPIO5"
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s
  - platform: monochromatic
    output: pwm_gpio12
    name: "Test GPIO12"
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s
  - platform: monochromatic
    output: pwm_gpio13
    name: "Test GPIO13"
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s
  - platform: monochromatic
    output: pwm_gpio14
    name: "Test GPIO14"
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s
  - platform: monochromatic
    output: pwm_gpio15
    name: "Test GPIO15"
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s
