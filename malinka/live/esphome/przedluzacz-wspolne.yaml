# JARVIS - wspolna konfiguracja przedluzaczy (ESP-12F / ESP8266, 2 przekazniki Panasonic 5 V = 2 pary gniazd, HLK-PM01).
# Zlacze UART plytki: 1=VCC 3,3 V, 2=GND, 3=RX, 4=TX; pola FLASH = GPIO0 do GND (tryb wgrywania).
# Przekazniki (sprawdzone 2026-11-11 na przedluzaczu 1): GPIO12 = para A, GPIO13 = para B, stan wysoki = wlaczone.
# Bezpieczenstwo: brak Wi-Fi przez 2 min -> obie pary WLACZONE (monitor zawsze da sie uzyc);
# po zaniku pradu - stan sprzed zaniku, pierwszy start - wlaczone. Brak internetu z zewnatrz nie ma znaczenia (wszystko w LAN).
esphome:
  name: ${nazwa}
  friendly_name: ${opis}
  on_boot:
    priority: -100
    then:
      - script.execute: awaryjne_wlaczenie   # gdy Wi-Fi nie wstanie po starcie

esp8266:
  board: esp12e
  restore_from_flash: true

preferences:
  flash_write_interval: 5min   # stan przekaznikow zapisywany z opoznieniem - mniej zuzycia flasha

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: ${ip}
    gateway: 192.168.254.1
    subnet: 255.255.255.0
    dns1: 192.168.254.1
  reboot_timeout: 0s           # bez restartu przy braku Wi-Fi (restart = chwilowe zgaszenie gniazd)
  # gdy siec zniknie / zmieni sie haslo: po minucie wlasna siec "<nazwa> Fallback" z formularzem Wi-Fi
  ap:
    ssid: "${nazwa} Fallback"
    password: !secret ap_password
  on_connect:
    - script.stop: awaryjne_wlaczenie
  on_disconnect:
    - script.execute: awaryjne_wlaczenie

captive_portal:

ota:
  - platform: esphome
    password: !secret ota_password

# sterowanie z malinki i z przegladarki: http://<ip> (login admin)
web_server:
  port: 80
  auth:
    username: admin
    password: !secret web_password

script:
  - id: awaryjne_wlaczenie
    mode: restart
    then:
      - delay: 2min
      - if:
          condition:
            not:
              wifi.connected:
          then:
            - logger.log: "Brak Wi-Fi od 2 min - wlaczam obie pary gniazd"
            - switch.turn_on: para_a
            - switch.turn_on: para_b

switch:
  - platform: gpio
    pin: GPIO12
    name: "${para_a}"
    id: para_a
    restore_mode: RESTORE_DEFAULT_ON
  - platform: gpio
    pin: GPIO13
    name: "${para_b}"
    id: para_b
    restore_mode: RESTORE_DEFAULT_ON

sensor:
  - platform: wifi_signal
    name: "Sygnal Wi-Fi"
    update_interval: 120s
  - platform: uptime
    name: "Czas pracy"