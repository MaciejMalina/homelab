services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    # Host ma w resolv.conf tylko DNS Tailscale (100.100.100.100) — wewnętrzny DNS Dockera go nie używa
    # (SERVFAIL dla api.open-meteo.com, 2026-10-27). Najpierw AdGuard na malince, potem Cloudflare.
    dns:
      - 192.168.254.10
      - 1.1.1.1
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - config/homepage.env
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS}   # z .env obok (adresy + domena, poza repo)
    volumes:
      - /home/macmal/homepage/config:/app/config
      - /home/macmal/homepage/config/images:/app/public/custom
      - /var/run/docker.sock:/var/run/docker.sock:ro
