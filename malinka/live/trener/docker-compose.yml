# JARVIS Trener — malinka, w miejscu mountain-trackera (port 8082)
# Dostęp tylko w tailnecie: sudo tailscale serve --bg --https=8444 http://localhost:8082
#   -> https://malinka.tail0524ca.ts.net:8444
# Dane (SQLite) w ./data — łapie je codzienny backup /home o 7:30 (kontenery pauzowane, kopia spójna).
services:
  trener:
    build: .
    image: jarvis-trener:local
    container_name: jarvis_trener
    ports:
      - "8082:3000"
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/trener.sqlite
      TZ: Europe/Warsaw
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
