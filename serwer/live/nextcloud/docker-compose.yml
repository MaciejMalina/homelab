services:
  nextcloud-db:
    image: mariadb:11
    container_name: nextcloud_db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - /mnt/data/nextcloud/db:/var/lib/mysql

  nextcloud-redis:
    image: redis:alpine
    container_name: nextcloud_redis
    restart: unless-stopped

  nextcloud:
    image: nextcloud:apache
    container_name: nextcloud
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - nextcloud-db
      - nextcloud-redis
    environment:
      - MYSQL_HOST=nextcloud-db
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - REDIS_HOST=nextcloud-redis
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - NEXTCLOUD_TRUSTED_DOMAINS=nextcloud.${DOMENA} 100.93.105.37
      - OVERWRITEPROTOCOL=https
      - OVERWRITEHOST=nextcloud.${DOMENA}
      - OVERWRITECLIURL=https://nextcloud.${DOMENA}
      - TRUSTED_PROXIES=100.105.181.54
      - APACHE_DISABLE_REWRITE_IP=1
    volumes:
      - /mnt/data/nextcloud/html:/var/www/html
