# =============================================================================
#  Homepage — fragment do wklejenia w services.yaml
# =============================================================================
#  Nowa grupa "Media" (nie było jej wcześniej w configu Macieja - dopisz
#  całą sekcję, tak jak przy grupie "Zarządzanie Infrastrukturą").
#  Adresy na hoście `serwer` (nie `malinka`) - to tam stoi ~/utorent.
#
#  qbittorrent: od 2026-09-07 port 8080 jest wystawiany przez KONTENER
#  gluetun (network_mode: service:gluetun), nie przez qbittorrent
#  bezpośrednio - ale href się NIE zmienia, bo gluetun publikuje ten sam
#  port 8080 na hoście `serwer`. Jeśli kiedyś zmienisz port WebUI
#  qbittorrenta, zmieniaj go w `ports:` pod gluetun w docker-compose.yml,
#  nie pod qbittorrent (tam już nie ma sekcji ports).
# =============================================================================

- Media:
    - Jellyfin:
        icon: jellyfin.png
        href: http://serwer:8096/
        description: Filmy i seriale (transkodowanie VAAPI na iGPU serwera)
        siteMonitor: http://serwer:8096/health

    - Sonarr:
        icon: sonarr.png
        href: http://serwer:8989/
        description: Automatyczne seriale

    - Radarr:
        icon: radarr.png
        href: http://serwer:7878/
        description: Automatyczne filmy

    - Jackett:
        icon: jackett.png
        href: http://serwer:9117/
        description: Indeksery dla Sonarr/Radarr

    - qBittorrent:
        icon: qbittorrent.png
        href: http://serwer:8080/
        description: Klient torrent (przez VPN AirVPN via gluetun)
