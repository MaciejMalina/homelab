# =============================================================================
#  SERWER — ~/utorent (Jellyfin + automatyzacja pobierania mediów)
# =============================================================================
#  Historia: 2026-09-07 Maciej zbudował własny stack (VAAPI przez /dev/dri —
#  iGPU Intel HD 530 procesora, GTX 960 zostaje wolna dla Ollamy). 2026-09-07
#  (wieczór) dodany gluetun (VPN, AirVPN/WireGuard) + dane przeniesione z
#  dysku systemowego na macierz RAID1 (/mnt/data, /dev/md0).
#
#  ZAKRES VPN (decyzja Macieja 2026-09-07): TYLKO qbittorrent routuje ruch
#  przez gluetun (`network_mode: service:gluetun`) — to jedyny kontener,
#  który faktycznie rozmawia z peerami/trackerami i ujawnia adres IP.
#  Jellyfin/Sonarr/Radarr/Jackett/flaresolverr zostają na zwykłej sieci
#  Dockera z własnymi portami — dostają `depends_on: gluetun` WYŁĄCZNIE dla
#  kolejności startu, nie routingu. Świadomie: routowanie Jellyfina przez VPN
#  wymagałoby FIREWALL_OUTBOUND_SUBNETS w gluetun (inaczej LAN nie dobije do
#  streamingu) i podniosłoby opóźnienie/obniżyło przepustowość bez żadnej
#  korzyści (Jellyfin i tak jest tylko na sieci lokalnej).
#
#  Sekrety WireGuard: NIE hardkodowane w tym pliku (padły w plaintext na
#  czacie 2026-09-07 — trzeba je zrotować w panelu AirVPN). Idą przez
#  `.env` obok tego pliku (patrz .env.example) — ten sam wzorzec co reszta
#  jarvis-infra (sops+age dla źródła prawdy, .env na maszynie).
#
#  Dane (media/downloads) na RAID1: /mnt/data/media/{movies,series,downloads,
#  torrents/files} (dev/md0, 858 GB wolne 2026-09-07). appdata/ (configi
#  kontenerów) zostaje na dysku systemowym pod ~/utorent/appdata — małe,
#  nie wymaga redundancji RAID.
#
#  Homepage: fragment do wklejenia w services.yaml - patrz
#  homepage-services.yaml obok tego pliku.
#
#  Indeksery Jackett (1337x, Internet Archive, LimeTorrents, Nyaa.si,
#  RuTracker.RU, The Pirate Bay, TorrentDownload) dodawane RĘCZNIE przez UI
#  Jackett (http://serwer:9117 → Add indexer) — nie da się tego bezpiecznie
#  wstrzyknąć z zewnątrz bez ryzyka literówki w ID indeksera; RuTracker może
#  wymagać loginu/hasła — wpisz je bezpośrednio w UI Jackett, nie na czacie.
# =============================================================================
services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 8080:8080/tcp   # qBittorrent WebUI (przeniesione tu z qbittorrent)
      - 32551:32551/tcp # qBittorrent torrenting port
      - 32551:32551/udp # qBittorrent torrenting port
      - 8000:8000/tcp   # gluetun control server
    volumes:
      - ./appdata/gluetun:/gluetun
    environment:
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
      - VPN_SERVICE_PROVIDER=airvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_ADDRESSES=${AIRVPN_WIREGUARD_ADDRESSES}
      - SERVER_COUNTRIES=Netherlands
      - TZ=Europe/Warsaw
      - FIREWALL_VPN_INPUT_PORTS=32551
      - WIREGUARD_PRIVATE_KEY=${AIRVPN_WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_PRESHARED_KEY=${AIRVPN_WIREGUARD_PRESHARED_KEY}
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Warsaw
    volumes:
      - ./appdata/jellyfin:/config
      - /mnt/data/media/series:/data/tvshows
      - /mnt/data/media/movies:/data/movies
    ports:
      - 8096:8096
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card0:/dev/dri/card0
    depends_on:
      - gluetun
    restart: unless-stopped
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - AUTO_UPDATE=true
    volumes:
      - ./appdata/jackett:/config
      - /mnt/data/media/torrents/files:/downloads
    ports:
      - 9117:9117
    depends_on:
      - gluetun
    restart: unless-stopped
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FILE=${LOG_FILE:-none}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=Europe/Warsaw
    ports:
      - "${PORT:-8191}:8191"
    volumes:
      - /var/lib/flaresolver:/config
    depends_on:
      - gluetun
    restart: unless-stopped
  sonarr:
    image: ghcr.io/hotio/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Warsaw
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./appdata/sonarr:/config
      - /mnt/data/media:/data
    ports:
      - 8989:8989
    depends_on:
      - gluetun
    restart: unless-stopped
  radarr:
    image: ghcr.io/hotio/radarr
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Europe/Warsaw
    volumes:
      - ./appdata/radarr:/config
      - /mnt/data/media:/data
    ports:
      - 7878:7878
    depends_on:
      - gluetun
    restart: unless-stopped
  qbittorrent:
    image: linuxserver/qbittorrent
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Warsaw
      - WEBUI_PORT=8080
      - TORRENTING_PORT=32551
    volumes:
      - ./appdata/qbit:/config
      - /mnt/data/media/downloads:/data/downloads
    network_mode: service:gluetun
    depends_on:
      - gluetun
    restart: unless-stopped
