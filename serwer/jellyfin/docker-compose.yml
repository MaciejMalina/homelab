# =============================================================================
#  SERWER — Jellyfin (transkodowanie sprzętowe na GTX 960 / NVENC)
# =============================================================================
#  Decyzja 2026-09-07: Jellyfin na serwerze (nie na malince) ze względu na
#  NVENC. Konsekwencja: serwer śpi (idle-shutdown) i budzi się przez WoL —
#  patrz malinka/wake-gate/ (osobny mini-serwis na malince, który budzi
#  serwera na żądanie, zanim ktoś w ogóle dotrze do tego adresu).
#
#  WYMAGANIE PRZED URUCHOMIENIEM: nvidia-container-toolkit — patrz
#  serwer/setup-nvidia-docker.sh w tym repo (audyt 2026-09-06 miał to jako
#  GPU-DOCKER: niepotwierdzone, sprawdź zanim odpalisz to compose).
#
#  Ekspozycja: TYLKO Tailscale Serve (decyzja 2026-09-07) —
#     sudo tailscale serve --https=<PORT> http://localhost:8096
#  (sprawdź wolny port przez `tailscale serve status`, Trot ma 8443, Kuma
#  10000 na malince — to jest NA SERWERZE, więc pula portów jest osobna, ale
#  zostań przy konwencji >8000 dla porządku).
#
#  UZUPEŁNIĆ przed pierwszym uruchomieniem:
#    - ścieżka do biblioteki mediów niżej (obecnie placeholder /mnt/data/media)
#    - /home/macmal/jellyfin/{config,cache} — utworzyć katalogi przed startem
#
#  Uruchomienie:
#     mkdir -p /home/macmal/jellyfin/config /home/macmal/jellyfin/cache
#     cd ~/jellyfin && docker compose up -d
#     docker logs -f jellyfin   # pierwsze uruchomienie tworzy admina przez UI
# =============================================================================
services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - TZ=Europe/Warsaw
    ports:
      - "8096:8096"
    volumes:
      - /home/macmal/jellyfin/config:/config
      - /home/macmal/jellyfin/cache:/cache
      - /mnt/data/media:/media:ro   # TODO: podmień na prawdziwą ścieżkę biblioteki
